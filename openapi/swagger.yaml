                      name: Nigerian Naira
                      mid_market_rate: 1358.97
                      mid_market_updated_at: '2026-04-27T15:56:11Z'
                      unigox_fee_pct: 0.25
                      offramp:
                        supported: true
                        p2p:
                          rate: 1542.6
                        licensed:
                          rate: 1376.857
                      onramp:
                        supported: true
                        p2p:
                          rate: 1370
                        licensed:
                          rate: 1389.35
                    - code: BRL
                      name: Brazilian Real
                      mid_market_rate: 4.9911
                      mid_market_updated_at: '2026-04-27T15:56:11Z'
                      unigox_fee_pct: 0.5
                      offramp:
                        supported: true
                        p2p:
                          rate: 4.4648
                          min_notional_fiat: 3465
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

