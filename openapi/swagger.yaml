            application/json:
              schema:
                $ref: '#/components/schemas/PartnerErrorResponse'
  /api/v1/partner/business-customers/{business_customer_id}/fiat-accounts/{fiat_account_id}/ledger:
    get:
      tags:
        - Business Customers
      summary: Every entry on the account's book
      operationId: getBusinessFiatAccountLedger
