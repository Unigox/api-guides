name: Validate OpenAPI

# Why this exists:
# The publishing workflow only runs AFTER a merge to main, so until now the first thing that ever
# read the spec strictly was the GitBook publish step — by which point a structurally broken spec
# was already on main and the failure showed up as "documentation stopped updating" rather than as
# a rejected change. A single unquoted comma inside a YAML flow map is enough to do it: it silently
# turns the rest of a description into an extra, unknown key on the schema property.
#
# This gate runs the same structural validation BEFORE the merge, on the pull request.

on:
  pull_request:
    paths:
      - "openapi/**"
      - ".github/workflows/validate-openapi.yml"
  push:
    branches: [main]
    paths:
      - "openapi/**"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: pip install --quiet openapi-spec-validator pyyaml

      - name: Validate the specification
        run: |
          python - <<'PY'
          import sys, yaml
          from openapi_spec_validator import validate

          with open("openapi/swagger.yaml", encoding="utf-8") as handle:
              spec = yaml.safe_load(handle)

          try:
              validate(spec)
          except Exception as error:
              print("OpenAPI specification is NOT valid:\n", error)
              sys.exit(1)

          print("OpenAPI specification is valid.")
          PY
